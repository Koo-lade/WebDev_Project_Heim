<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheels on Fire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="Wheels on fire.png" alt="Wheels on Fire logo" height="150">
    <ul class="header">
        <li><a href="index.html" class="header-button">Home</a></li>
        <li><a href="about.html" class="header-button">About us</a></li>
        <li><a href="new_cars.html" class="header-button">New Cars</a></li>
        <li><a href="used_cars.html" class="header-button">Used Cars</a></li>
    </ul>
    <hr>
    <ul class="searchbar">
        <li><label for="Make">Makes: </label>
        <select class="searchbar" name="Make" id="Make">
            <option value="Any">Any</option>
            <option value="Ford">Ford</option>
            <option value="Renault">Renault</option>
            <option value="Opel">Opel</option>
        </select></li>
        <li><label for="Model">Model:</label>
        <select class="searchbar" name="Model" id="Model">
            <option value="Any">Any</option>
            <option value="Model 1">Model 1</option>
            <option value="Model 2">Model 2</option>
            <option value="Model 3">Model 3</option>    
            </select>
        </li>
        <li>
            <label for="Year">Year: </label>
            <select class="searchbar" name="Year" id="Year">
            <option value="Any">Any</option>
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            </select>
        </li>
        <li>
            <label for="Price">Price</label>
            <select class="searchbar" name="Price" id="Price">
                <option value="Any">Any</option>
                <option value="5000">€5000</option>
                <option value="8000">€8000</option>
                <option value="10000">€10000</option>
            </select>
        </li>
        <li> <label for="Search">Search: </label>
        <input class="searchbar" type="search" id="search" name="search"></li>
    </ul>
    <p>Welcome to the premiere centre for perusing, appreciating, and purchasing vehicles!
         Above you will find a few options to learn more about the company, and browse our catalogue!</p>
    <footer><hr>&copy; Wheels On Fire LTD 2026</footer>
</body>
</html>
